# Conda alternative to requirements.txt (conda-forge provides cartopy with its GEOS/PROJ libraries).
name: osr11
channels: [conda-forge]
dependencies:
  - python=3.13
  - numpy=2.3.5
  - scipy=1.18.1
  - pandas=3.0.5
  - xarray=2026.9.0
  - netcdf4=1.7.5
  - statsmodels=0.15.0
  - numba=0.68.1
  - gsw=3.6.23
  - matplotlib=3.10.9
  - cartopy=0.26.0
  - pillow=12.3.0
  - pip
  - pip:
      - copernicusmarine   # extraction only
